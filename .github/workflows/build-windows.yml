name: Build Windows .exe & Release Bundle

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64 (GTK4 + Libadwaita + Python)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-opencv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-python-pip

      - name: Run Windows import, preflight & cross-platform unit tests
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          C:\msys64\ucrt64\bin\python3.exe -c "import vimona.airgap, vimona.storage, vimona.hf_models, vimona.search_worker, vimona.preflight; print('Imports OK on Windows')"
          $preJson = (C:\msys64\ucrt64\bin\python3.exe run_vimona.py --preflight --json) -join "`n"
          if ($LASTEXITCODE -ne 1) { throw "Expected exit code 1 for unsupported Windows preflight, got $LASTEXITCODE" }
          Write-Host $preJson
          $preJson | C:\msys64\ucrt64\bin\python3.exe -c "import json, sys; d = json.loads(sys.stdin.read()); assert d['platform_supported'] is False and d['can_start_gui'] is False, d"
          C:\msys64\ucrt64\bin\python3.exe -m unittest tests/test_config_preflight_logging.py tests/test_hardware_and_downloads.py tests/test_controller_skills_soak.py tests/test_search_and_safeblur.py -v

      - name: Install Inno Setup for Vimona-Setup.exe wizard
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Vimona.exe (onefile + onedir) and Vimona-Setup.exe
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          C:\msys64\ucrt64\bin\python3.exe -m pip install --no-warn-script-location pyinstaller
          & .\installers\build_windows_exe.ps1 -PythonExe "C:\msys64\ucrt64\bin\python3.exe"
          & .\installers\build_windows_exe.ps1 -PythonExe "C:\msys64\ucrt64\bin\python3.exe" -OneFile

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vimona-Windows-x64
          path: |
            dist/Vimona.exe
            dist/Vimona-Setup.exe
            downloads/Vimona-Windows-x86_64.zip
          if-no-files-found: warn

      - name: Publish Windows .exe builds to GitHub Releases
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: Vimona ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          files: |
            dist/Vimona.exe
            dist/Vimona-Setup.exe
            downloads/Vimona-Windows-x86_64.zip
