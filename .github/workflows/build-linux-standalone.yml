name: Build Multi-Distro Linux Packages & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4, Libadwaita, PyGObject, RPM, dpkg & AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-numpy python3-pil python3-opencv \
            ffmpeg gcc binutils patchelf libfuse2 desktop-file-utils \
            dpkg rpm zstd file

      - name: Install PyInstaller
        run: |
          python3 -m pip install --break-system-packages pyinstaller

      - name: Build AppDir, .run, .tar.gz, PyInstaller ELF, .deb, .rpm & Arch .pkg.tar.zst
        run: |
          chmod +x installers/build_linux_standalone.sh installers/build_linux_packages.sh
          ./installers/build_linux_standalone.sh --pyinstaller
          ./installers/build_linux_packages.sh

      - name: Package AppImage via appimagetool
        run: |
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            dist/Vimona.AppDir dist/Vimona-x86_64.AppImage

      - name: Smoke test standalone & package artifacts
        run: |
          ./dist/Vimona-Linux-x86_64.run --check
          dpkg-deb --info dist/vimona_1.0.0_amd64.deb
          rpm -qip dist/vimona-1.0.0-1.x86_64.rpm

      - name: Upload Linux packages workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vimona-Linux-Packages-x64
          path: |
            dist/vimona_1.0.0_amd64.deb
            dist/vimona-1.0.0-1.x86_64.rpm
            dist/vimona-1.0.0-1-x86_64.pkg.tar.zst
            dist/Vimona-x86_64.AppImage
            dist/Vimona-Linux-x86_64.run
            dist/Vimona-Linux-x86_64.tar.gz
            dist/Vimona-Linux-x86_64
          if-no-files-found: warn

      - name: Publish multi-distro Linux packages to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: Vimona ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          files: |
            dist/vimona_1.0.0_amd64.deb
            dist/vimona-1.0.0-1.x86_64.rpm
            dist/vimona-1.0.0-1-x86_64.pkg.tar.zst
            dist/Vimona-x86_64.AppImage
            dist/Vimona-Linux-x86_64.run
            dist/Vimona-Linux-x86_64.tar.gz
