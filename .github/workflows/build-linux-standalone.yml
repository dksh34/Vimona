name: Build Standalone Linux App

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4, Libadwaita, PyGObject, OpenCV, FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-numpy python3-pil python3-opencv \
            ffmpeg gcc binutils patchelf libfuse2 desktop-file-utils
      - name: Install PyInstaller
        run: |
          python3 -m pip install --break-system-packages pyinstaller
      - name: Build AppDir, .run, .tar.gz, and PyInstaller ELF
        run: |
          chmod +x installers/build_linux_standalone.sh
          ./installers/build_linux_standalone.sh --pyinstaller
      - name: Package AppImage via appimagetool
        run: |
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            dist/Vimona.AppDir dist/Vimona-x86_64.AppImage
      - name: Smoke test standalone runner
        run: |
          ./dist/Vimona-Linux-x86_64.run --check
      - name: Upload Linux standalone artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vimona-Linux-x86_64
          path: |
            dist/Vimona-Linux-x86_64.run
            dist/Vimona-Linux-x86_64.tar.gz
            dist/Vimona-Linux-x86_64
            dist/Vimona-x86_64.AppImage
          if-no-files-found: warn
